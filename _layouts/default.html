<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ed">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title | default: site.title | escape }}{% unless page.url == '/' %} — {{ site.name | escape }}{% endunless %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/accessibility.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.name | escape }}，首页"><span class="wordmark-mark">Z</span><span>{{ site.name | escape }}<span class="wordmark-en"> / NOTES &amp; WORK</span></span></a>
      <nav class="main-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a>
        <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' or page.layout == 'post' %} aria-current="page"{% endif %}>文章</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about/' %} aria-current="page"{% endif %}>关于</a>
        <a class="nav-github" href="https://github.com/xianglong-zhao" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </header>

    {{ content }}

    <footer class="site-footer"><a class="footer-mark" href="{{ '/' | relative_url }}">{{ site.name | escape }}<span> · 个人博客</span></a><span>用好奇心记录，用时间慢慢整理。</span><a href="https://github.com/xianglong-zhao" target="_blank" rel="noreferrer">GITHUB ↗</a></footer>
  </div>
</body>
</html>
